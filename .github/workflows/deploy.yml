name: Deploy site to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate concept-index outputs and check for drift
        run: |
          node tools/generate.mjs
          node tools/validate.mjs
          node tools/check-i18n.mjs
          git diff --exit-code generated/ content/ page-shell.js

      - name: Publish compiler host (code-lab submodule)
        run: >
          dotnet publish code-lab/compiler-host -c Release
          -o blazor-publish

      - name: Assemble site
        run: |
          mkdir _site
          rsync -a \
            --exclude='/.git' \
            --exclude='/.github' \
            --exclude='/code-lab' \
            --exclude='/level3-app' \
            --exclude='/blazor-publish' \
            --exclude='/_site' \
            ./ _site/
          cp -r blazor-publish/wwwroot _site/level3-app
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
